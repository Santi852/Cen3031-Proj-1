name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stacksprint_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stacksprint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/stacksprint_test
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
