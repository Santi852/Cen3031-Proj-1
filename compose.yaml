services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: stacksprint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stacksprint"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
